name: Build ORVA (Windows net48)
on:
  push:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore Desktop Project
        run: msbuild src/Orva.Desktop/Orva.Desktop.csproj /t:Restore /p:Configuration=Release
      - name: Build Desktop EXE (Release)
        run: msbuild src/Orva.Desktop/Orva.Desktop.csproj /p:Configuration=Release /m
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ORVA-v5.6.0-Windows
          path: src/Orva.Desktop/bin/
